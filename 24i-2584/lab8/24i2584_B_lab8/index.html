<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top 10 Richest Countries</title>

    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f8f9fa;
        }

        h1 {
            text-align: center;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
            border: none;
            background-color: #245b50;
            color: white;
            border-radius: 5px;
        }

        #buttons {
            text-align: center;
        }

        svg {
            display: block;
            margin: auto;
        }

        .bar {
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Top 10 Richest Countries</h1>

    <div id="buttons">
        <button onclick="updateChart(1952)">1952</button>
        <button onclick="updateChart(2007)">2007</button>
    </div>

    <svg id="chart" width="950" height="550"></svg>

    <script>
        const margin = {
            top: 30,
            right: 150,
            bottom: 40,
            left: 150
        };

        const width = 950 - margin.left - margin.right;
        const height = 550 - margin.top - margin.bottom;

        const svg = d3.select("#chart")
            .append("g")
            .attr("transform",
                `translate(${margin.left},${margin.top})`);

        const x = d3.scaleLinear()
            .range([0, width]);

        const y = d3.scaleBand()
            .range([0, height])
            .padding(0.2);

        let allData;

        d3.csv("dataset/gapminder.csv", d3.autoType)
            .then(function(data) {
                allData = data;
                updateChart(2007);
            })
            .catch(function(error) {
                console.error("Error loading CSV:", error);
                document.body.insertAdjacentHTML(
                    "beforeend",
                    "<p>Could not load the CSV. Check the dataset folder and Live Server.</p>"
                );
            });

        function updateChart(year) {
            const filteredData = allData
                .filter(d => d.year === year)
                .sort((a, b) => b.gdpPercap - a.gdpPercap)
                .slice(0, 10);

            x.domain([0, d3.max(filteredData, d => d.gdpPercap)]);
            y.domain(filteredData.map(d => d.country));

            svg.selectAll(".x-axis")
                .data([null])
                .join("g")
                .attr("class", "x-axis")
                .attr("transform", `translate(0,${height})`)
                .transition()
                .call(d3.axisBottom(x));

            svg.selectAll(".y-axis")
                .data([null])
                .join("g")
                .attr("class", "y-axis")
                .transition()
                .call(d3.axisLeft(y));

            const bars = svg.selectAll(".bar")
                .data(filteredData, d => d.country);

            bars.exit()
                .transition()
                .attr("width", 0)
                .remove();

            bars.enter()
                .append("rect")
                .attr("class", "bar")
                .attr("x", 0)
                .attr("y", d => y(d.country))
                .attr("height", y.bandwidth())
                .attr("width", 0)
                .attr("fill", d => {
                    if (d.continent === "Europe") return "#386641";
                    if (d.continent === "Asia") return "#bc4749";
                    if (d.continent === "Americas") return "#457b9d";
                    return "#888";
                })
                .append("title")
                .text(d => `${d.country}: ${d.gdpPercap}`);

            svg.selectAll(".bar")
                .data(filteredData, d => d.country)
                .join(
                    enter => enter.append("rect")
                        .attr("class", "bar")
                        .attr("x", 0)
                        .attr("y", d => y(d.country))
                        .attr("height", y.bandwidth())
                        .attr("width", 0),
                    update => update,
                    exit => exit.remove()
                )
                .transition()
                .duration(750)
                .attr("y", d => y(d.country))
                .attr("height", y.bandwidth())
                .attr("width", d => x(d.gdpPercap))
                .attr("fill", d => {
                    if (d.continent === "Europe") return "#386641";
                    if (d.continent === "Asia") return "#bc4749";
                    if (d.continent === "Americas") return "#457b9d";
                    return "#888";
                });

            svg.selectAll(".bar")
                .select("title")
                .text(d => `${d.country}: ${d.gdpPercap.toLocaleString()}`);

            svg.selectAll(".bar-label")
                .data(filteredData, d => d.country)
                .join("text")
                .attr("class", "bar-label")
                .attr("x", d => x(d.gdpPercap) + 5)
                .attr("y", d => y(d.country) + y.bandwidth() / 2)
                .attr("dominant-baseline", "middle")
                .attr("font-size", "11px")
                .text(d => Math.round(d.gdpPercap).toLocaleString());

            d3.select("#chart-title").remove();
        }
    </script>

</body>
</html>
