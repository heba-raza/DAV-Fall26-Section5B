<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab 9 — D3.js Visualizations</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
:root{--ink:#172033;--muted:#667085;--line:#e5e7eb;--accent:#4f46e5;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}header{background:#111827;color:white;padding:25px clamp(16px,4vw,48px)}header h1{margin:0 0 5px;font-size:clamp(23px,3vw,32px)}header p{margin:0;color:#cbd5e1}.wrap{max-width:1400px;margin:auto;padding:22px clamp(12px,3vw,32px)}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.tab{border:1px solid var(--line);background:white;padding:10px 13px;border-radius:10px;cursor:pointer;font-weight:650;color:#344054}.tab.active{background:var(--accent);color:white;border-color:var(--accent)}.panel{display:none;background:white;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 5px 20px #1018280a}.panel.active{display:block}.panel h2{margin:0 0 4px;font-size:22px}.desc{margin:0 0 16px;color:var(--muted)}.status{padding:10px 12px;border-radius:9px;background:#eef2ff;color:#3730a3;margin:10px 0 14px}.status.error{background:#fff1f2;color:#9f1239}.chart{width:100%;min-height:360px;overflow:auto}.chart svg{display:block;max-width:100%;height:auto}.tooltip{position:fixed;pointer-events:none;background:#111827;color:white;padding:8px 10px;border-radius:7px;font-size:12px;opacity:0;z-index:10;max-width:260px;box-shadow:0 4px 15px #0002}.legend{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0;color:#475467;font-size:13px}.legend span{display:inline-flex;align-items:center;gap:5px}.swatch{display:inline-block;width:12px;height:12px;border-radius:3px}.small{font-size:12px;color:var(--muted)}.link{fill:none;stroke:#94a3b8;stroke-opacity:.65}.node-label{font-size:11px;fill:#344054}.country{stroke:white;stroke-width:.45}.country:hover{stroke:#111827;stroke-width:1.5}.route{stroke:#64748b;stroke-opacity:.55;fill:none}.city{stroke:white;stroke-width:1.2;cursor:pointer}.city-label{font-size:11px;fill:#172033;paint-order:stroke;stroke:white;stroke-width:3px;stroke-linejoin:round}.footer{color:#98a2b3;font-size:12px;margin-top:18px}
</style></head><body>
<header><h1>Lab 9: Hierarchical, Network & Geospatial Visualizations</h1><p>Data Analysis and Visualization · D3.js v7 · Tasks 1–6</p></header>
<div class="wrap"><nav id="tabs"></nav><div id="panels"></div><div class="footer">Run with VS Code Live Server. Keep the dataset folder beside this file and preserve the filenames shown in the lab manual.</div></div><div class="tooltip" id="tip"></div>
<script>
const tasks=[
['Task 1','Course Enrollment Treemap','university.csv · University → Department → Course'],
['Task 2','University Structure Dendrogram','university.csv · parent-child hierarchy'],
['Task 3','Flight Route Network','flights.csv · force-directed graph'],
['Task 4','World Population Choropleth','population.csv + custom.geo.json'],
['Task 5','Pakistan Cities Point Map','pakistan_cities.csv + custom.geo.json'],
['Task 6','Combined Spatial Encoding Map','pakistan_cities.csv + flights.csv']
];
const nav=d3.select('#tabs'), panels=d3.select('#panels');
tasks.forEach((t,i)=>{nav.append('button').attr('class','tab'+(!i?' active':'')).text(t[0]).on('click',()=>show(i));let p=panels.append('section').attr('class','panel'+(!i?' active':'')).attr('id','p'+i);p.append('h2').text(t[1]);p.append('p').attr('class','desc').text(t[2]);p.append('div').attr('class','status').attr('id','s'+i).text('Loading dataset…');p.append('div').attr('class','legend').attr('id','l'+i);p.append('div').attr('class','chart').attr('id','c'+i)});
function show(i){d3.selectAll('.tab').classed('active',function(_,j){return j===i});d3.selectAll('.panel').classed('active',function(_,j){return j===i});if(!rendered.has(i)) drawTask(i)}
const rendered=new Set();const tip=d3.select('#tip');function tooltip(e,html){tip.html(html).style('opacity',1).style('left',(e.clientX+14)+'px').style('top',(e.clientY+14)+'px')}function hideTip(){tip.style('opacity',0)}
function status(i,msg,err=false){d3.select('#s'+i).attr('class','status'+(err?' error':'')).text(msg)}
function svg(i,w=1000,h=560){return d3.select('#c'+i).html('').append('svg').attr('viewBox',`0 0 ${w} ${h}`).attr('width','100%').attr('height',h)}
async function csv(name){return d3.csv('dataset/'+name,d3.autoType)}async function geo(){return d3.json('dataset/custom.geo.json')}
function fail(i,e){status(i,'Could not load required data. Check the exact filenames and columns in the dataset/ folder, then refresh. '+(e?.message||''),true);d3.select('#c'+i).html('<p class="small">Expected files are listed above. This project does not include fabricated replacement data.</p>')}
function legend(i,items){let l=d3.select('#l'+i).html('');items.forEach(x=>l.append('span').html(`<i class="swatch" style="background:${x[1]}"></i>${x[0]}`))}
function field(row,keys){for(const k of keys){if(row[k]!==undefined&&row[k]!==null&&row[k]!=='')return row[k]}return null}
function drawTask(i){rendered.add(i);({0:treemap,1:dendrogram,2:network,3:choropleth,4:pointmap,5:combined}[i])()}
async function treemap(){let i=0;try{let rows=await csv('university.csv');if(!rows.length)throw Error('university.csv is empty');let root=d3.hierarchy({name:'University',children:d3.groups(rows,d=>d.department).map(([department,rs])=>({name:department,children:rs.map(r=>({name:r.course,value:+r.students,department}))}))}).sum(d=>d.value||0).sort((a,b)=>b.value-a.value);d3.treemap().size([1100,570]).paddingInner(3).paddingTop(22)(root);let colors=d3.scaleOrdinal(d3.schemeTableau10);let s=svg(i,1120,600);let g=s.selectAll('g').data(root.leaves()).join('g').attr('transform',d=>`translate(${d.x0+5},${d.y0+5})`);g.append('rect').attr('width',d=>Math.max(0,d.x1-d.x0-1)).attr('height',d=>Math.max(0,d.y1-d.y0-1)).attr('rx',3).attr('fill',d=>colors(d.parent.data.name)).on('mousemove',(e,d)=>tooltip(e,`<b>${d.data.name}</b><br>${d.parent.data.name}<br>Students: ${d.value}`)).on('mouseleave',hideTip);g.append('text').attr('x',5).attr('y',15).attr('fill','white').attr('font-size',12).text(d=>d.x1-d.x0>55?d.data.name:'');g.append('title').text(d=>`${d.data.name} · ${d.parent.data.name} · ${d.value} students`);legend(i,[...new Set(rows.map(d=>d.department))].map((x,j)=>[x,colors(x)]));status(i,`${rows.length} courses loaded. Rectangle area represents student enrollment.`)}catch(e){fail(i,e)}}
async function dendrogram(){let i=1;try{let rows=await csv('university.csv');if(!rows.length)throw Error('university.csv is empty');let root=d3.hierarchy({name:'University',children:d3.groups(rows,d=>d.department).map(([name,rs])=>({name,children:rs.map(r=>({name:r.course}))}))});d3.cluster().size([570,900]).separation((a,b)=>a.parent===b.parent?1:1.3)(root);let s=svg(i,1120,620),g=s.append('g').attr('transform','translate(80,20)');g.selectAll('path').data(root.links()).join('path').attr('class','link').attr('d',d3.linkHorizontal().x(d=>d.y).y(d=>d.x));let nodes=g.selectAll('g.node').data(root.descendants()).join('g').attr('class','node').attr('transform',d=>`translate(${d.y},${d.x})`);nodes.append('circle').attr('r',d=>d.depth===0?7:5).attr('fill',d=>['#4f46e5','#0d9488','#f59e0b'][d.depth]||'#64748b').on('click',(e,d)=>{if(d.children){d._children=d.children;d.children=null}else if(d._children){d.children=d._children;d._children=null}rendered.delete(i);dendrogram()});nodes.append('text').attr('dy','.32em').attr('x',d=>d.children||d.depth===0?-10:10).attr('text-anchor',d=>d.children||d.depth===0?'end':'start').attr('class','node-label').text(d=>d.data.name);legend(i,[['University','#4f46e5'],['Department','#0d9488'],['Course','#f59e0b']]);status(i,'Horizontal dendrogram. Click a department node to collapse or expand its courses.')}catch(e){fail(i,e)}}
async function network(){let i=2;try{let links0=await csv('flights.csv');if(!links0.length)throw Error('flights.csv is empty');let links=links0.map(d=>({source:String(d.source),target:String(d.target),flights:+d.flights}));let names=[...new Set(links.flatMap(d=>[d.source,d.target]))],degree=new Map(names.map(n=>[n,0]));links.forEach(d=>{degree.set(d.source,degree.get(d.source)+1);degree.set(d.target,degree.get(d.target)+1)});let nodes=names.map(id=>({id,degree:degree.get(id)}));let s=svg(i,1100,650),g=s.append('g');let width=d3.scaleLinear().domain(d3.extent(links,d=>d.flights)).range([1,6]);let r=d3.scaleSqrt().domain(d3.extent(nodes,d=>d.degree)).range([7,20]);let line=g.selectAll('line').data(links).join('line').attr('class','route').attr('stroke-width',d=>width(d.flights));let ng=g.selectAll('g.node').data(nodes).join('g').attr('class','node').call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y}).on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));ng.append('circle').attr('r',d=>r(d.degree)).attr('fill','#4f46e5');ng.append('text').attr('x',10).attr('y',4).attr('class','node-label').text(d=>d.id);ng.on('mousemove',(e,n)=>{line.attr('stroke-opacity',d=>(d.source.id===n.id||d.target.id===n.id) ? .95 : .05).attr('stroke',d=>d.source.id===n.id||d.target.id===n.id?'#f97316':'#94a3b8');ng.attr('opacity',d=>d.id===n.id||links.some(l=>(l.source.id===n.id&&l.target.id===d.id)||(l.target.id===n.id&&l.source.id===d.id))?1:.2);tooltip(e,`<b>${n.id}</b><br>Routes (degree): ${n.degree}`)}).on('mouseleave',()=>{hideTip();line.attr('stroke-opacity',.55).attr('stroke','#64748b');ng.attr('opacity',1)});let sim=d3.forceSimulation(nodes).force('link',d3.forceLink(links).id(d=>d.id).distance(115).strength(.6)).force('charge',d3.forceManyBody().strength(-280)).force('center',d3.forceCenter(550,320)).force('collide',d3.forceCollide(d=>r(d.degree)+8)).on('tick',()=>{line.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);ng.attr('transform',d=>`translate(${d.x},${d.y})`)});legend(i,[['Route width = weekly flights','#64748b'],['Highlighted route','#f97316']]);status(i,`${nodes.length} cities and ${links.length} route records loaded. Drag nodes; hover to highlight connected routes.`)}catch(e){fail(i,e)}}
async function choropleth(){let i=3;try{let [rows,world]=await Promise.all([csv('population.csv'),geo()]);if(!rows.length)throw Error('population.csv is empty');let pop=new Map(rows.map(d=>[String(field(d,['id','iso_a3','country_code'])||'').toUpperCase(),+d.population_millions]));let max=d3.max(rows,d=>+d.population_millions)||1,color=d3.scaleSequentialSqrt([0,max],d3.interpolateYlOrRd);let s=svg(i,1100,570),projection=d3.geoNaturalEarth1().fitExtent([[8,8],[1090,555]],world),path=d3.geoPath(projection);s.selectAll('path').data(world.features).join('path').attr('class','country').attr('d',path).attr('fill',d=>{let p=d.properties;let v=pop.get(String(p.ISO_A3||p.iso_a3||p.adm0_a3||'').toUpperCase());return v==null?'#e5e7eb':color(v)}).on('mousemove',(e,d)=>{let p=d.properties,v=pop.get(String(p.ISO_A3||p.iso_a3||p.adm0_a3||'').toUpperCase());tooltip(e,`<b>${p.name||p.ADMIN||'Country'}</b><br>${v==null?'No data':v+' million people'}`)}).on('mouseleave',hideTip);legend(i,[['No data','#e5e7eb'],['Lower population',color(0)],['Higher population',color(max)]]);status(i,`${rows.length} population rows loaded. Countries without a matching code are shown in light gray. If all countries are gray, check the population CSV id format against GeoJSON adm0_a3 codes.`)}catch(e){fail(i,e)}}
function cityName(d){return String(field(d,['name','city','city_name'])||'')};async function pointmap(){let i=4;try{let [cities,world]=await Promise.all([csv('pakistan_cities.csv'),geo()]);if(!cities.length)throw Error('pakistan_cities.csv is empty');let pak=world.features.filter(f=>String(f.properties.name||'')==='Pakistan'||String(f.properties.admin||'')==='Pakistan');let s=svg(i,900,650),projection=d3.geoMercator();let feature=pak.length?{type:'FeatureCollection',features:pak}:world;projection.fitExtent([[35,30],[865,620]],feature);let path=d3.geoPath(projection);s.selectAll('path.land').data(feature.features).join('path').attr('class','land').attr('d',path).attr('fill','#f1f5f9').attr('stroke','#cbd5e1');let max=d3.max(cities,d=>+d.pop)||1,r=d3.scaleSqrt().domain([0,max]).range([3,23]);s.selectAll('circle.city').data(cities).join('circle').attr('class','city').attr('cx',d=>projection([+d.lon,+d.lat])[0]).attr('cy',d=>projection([+d.lon,+d.lat])[1]).attr('r',d=>r(+d.pop)).attr('fill','#4f46e5').attr('fill-opacity',.55).on('mousemove',(e,d)=>tooltip(e,`<b>${cityName(d)}</b><br>Population: ${d.pop}`)).on('mouseleave',hideTip);s.selectAll('text.city-label').data(cities.filter(d=>+d.pop>1)).join('text').attr('class','city-label').attr('x',d=>projection([+d.lon,+d.lat])[0]+7).attr('y',d=>projection([+d.lon,+d.lat])[1]-7).text(cityName);legend(i,[['City population (circle area)','#4f46e5']]);status(i,`${cities.length} cities plotted. Only cities with population above 1 million are labelled; all cities have tooltips.`)}catch(e){fail(i,e)}}
async function combined(){let i=5;try{let [cities,flights,world]=await Promise.all([csv('pakistan_cities.csv'),csv('flights.csv'),geo()]);if(!cities.length||!flights.length)throw Error('pakistan_cities.csv or flights.csv is empty');let byName=new Map(cities.map(d=>[cityName(d).trim().toLowerCase(),d]));let degree=new Map(cities.map(d=>[cityName(d),0]));flights.forEach(d=>{if(degree.has(d.source))degree.set(d.source,degree.get(d.source)+1);if(degree.has(d.target))degree.set(d.target,degree.get(d.target)+1)});let routes=flights.map(d=>({source:byName.get(String(d.source).trim().toLowerCase()),target:byName.get(String(d.target).trim().toLowerCase()),flights:+d.flights})).filter(d=>d.source&&d.target);let pak=world.features.filter(f=>String(f.properties.name||'')==='Pakistan'||String(f.properties.admin||'')==='Pakistan');let feature=pak.length?{type:'FeatureCollection',features:pak}:world;let s=svg(i,900,650),projection=d3.geoMercator().fitExtent([[35,30],[865,620]],feature),path=d3.geoPath(projection);s.selectAll('path.land').data(feature.features).join('path').attr('class','land').attr('d',path).attr('fill','#f8fafc').attr('stroke','#cbd5e1');let w=d3.scaleLinear().domain(d3.extent(flights,d=>+d.flights)).range([1,5]),r=d3.scaleSqrt().domain([0,d3.max(cities,d=>+d.pop)||1]).range([4,20]);let line=s.append('g').selectAll('line').data(routes).join('line').attr('class','route').attr('x1',d=>projection([+d.source.lon,+d.source.lat])[0]).attr('y1',d=>projection([+d.source.lon,+d.source.lat])[1]).attr('x2',d=>projection([+d.target.lon,+d.target.lat])[0]).attr('y2',d=>projection([+d.target.lon,+d.target.lat])[1]).attr('stroke-width',d=>w(d.flights));let nodes=s.append('g').selectAll('g').data(cities).join('g').attr('transform',d=>`translate(${projection([+d.lon,+d.lat])})`);nodes.append('circle').attr('class','city').attr('r',d=>r(+d.pop)).attr('fill',d=>(degree.get(cityName(d))||0)>=4?'#dc2626':'#2563eb').attr('fill-opacity',.7);nodes.append('text').attr('class','city-label').attr('x',7).attr('y',-7).text(d=>+d.pop>1?cityName(d):'');nodes.on('mousemove',(e,d)=>{line.attr('stroke-opacity',l=>l.source===d||l.target===d?1:.06).attr('stroke',l=>l.source===d||l.target===d?'#f97316':'#64748b');nodes.attr('opacity',n=>routes.some(l=>(l.source===d&&l.target===n)||(l.target===d&&l.source===n))||n===d?1:.2);tooltip(e,`<b>${cityName(d)}</b><br>Population: ${d.pop}<br>Routes (degree): ${degree.get(cityName(d))||0}`)}).on('mouseleave',()=>{hideTip();line.attr('stroke-opacity',.55).attr('stroke','#64748b');nodes.attr('opacity',1)});legend(i,[['Hub: 4+ routes','#dc2626'],['Other city','#2563eb'],['Route width = flights/week','#64748b'],['Circle area = population','#4f46e5']]);status(i,`${cities.length} cities and ${routes.length} matched routes drawn. Routes are drawn beneath cities. ${flights.length-routes.length} routes could not be matched to city coordinates; check city spelling.`)}catch(e){fail(i,e)}}
// Render first task immediately; others render when selected.
drawTask(0);
</script></body></html>
